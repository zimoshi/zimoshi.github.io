<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FlappyBirdX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script>
    (function () {
      const lang =
        (navigator.languages && navigator.languages[0]) ||
        navigator.language ||
        navigator.userLanguage ||
        "en";

      const l = lang.toLowerCase();

      let target = "index.html";

      // Simplified Chinese
      if (
        l === "zh-cn" ||
        l === "zh-sg" ||
        l.startsWith("zh-hans")
      ) {
        target = "index.zh-cn.html";
      }

      // Traditional Chinese
      else if (
        l === "zh-tw" ||
        l === "zh-hk" ||
        l === "zh-mo" ||
        l.startsWith("zh-hant")
      ) {
        target = "index.zh-tw.html";
      }

      if (!location.pathname.endsWith(target)) {
        location.replace(target);
      }
    })();
  </script>
</head>

<body>
  <noscript>
    <p>
      Choose language manually:
      <br />
      <a href="en.html">English</a> |
      <a href="cn.html">简体中文</a> |
      <a href="tw.html">繁體中文</a>
    </p>
  </noscript>
</body>
</html>
