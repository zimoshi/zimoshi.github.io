<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hard Mode CAPTCHA – Drag, Carry, Pop</title>
  <style>
    :root { --w: 760px; --h: 460px; --bg: #0b1220; --panel: #121a2b; --accent: #64d3ff; }
    body { margin: 0; background: var(--bg); font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, sans-serif; color: #e6eef9; display: grid; place-items: center; height: 100dvh; }
    .wrap { width: var(--w); max-width: 96vw; }
    header { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    h1 { font-size: clamp(16px, 2.5vw, 24px); margin: 16px 0; letter-spacing: .3px; }
    .board { position: relative; aspect-ratio: 19/11.5; width: 100%; background: linear-gradient(180deg,#0e1728,#0a1020); border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.05); overflow: hidden; }
    canvas { display:block; width: 100%; height: 100%; }
    .hud { margin-top: 10px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .pill { background: var(--panel); border: 1px solid rgba(255,255,255,.08); padding: 6px 10px; border-radius: 999px; font-size: 12px; }
    .btn { cursor: pointer; user-select: none; }
    .btn:hover { outline: 1px solid rgba(255,255,255,.15); }
    .kbd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #0c1426; padding: 2px 6px; border-radius: 6px; border: 1px solid rgba(255,255,255,.08); }
    a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Human Check – Drag ➜ Carry ➜ Pop</h1>
      <div class="pill">Goal: finish all 3 stages</div>
    </header>
    <div class="board"><canvas id="game" width="1140" height="690" aria-label="CAPTCHA mini-game"></canvas></div>
    <div class="hud">
      <div class="pill" id="status">Stage 1: Drag the circle into the target.</div>
      <div class="pill">Keys: <span class="kbd">←</span> <span class="kbd">→</span> <span class="kbd">↑</span> <span class="kbd">↓</span></div>
      <div class="pill btn" id="reset">Reset</div>
    </div>
  </div>

  <script>
    // Simple state machine game: Stage 1 (drag), Stage 2 (carry via arrows), Stage 3 (pop red balloons)
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const resetBtn = document.getElementById('reset');

    const W = canvas.width, H = canvas.height;
    const px = n => Math.round(n);

    const rand = (min, max) => Math.random() * (max - min) + min;
    const choice = arr => arr[Math.floor(Math.random() * arr.length)];

    const COLORS = {
      field: ['#0e1728','#0a1020'],
      ball: '#ffd76b',
      goal: '#5cf5a2',
      storage: '#64d3ff',
      wall: '#27324d',
      wallEdge: 'rgba(255,255,255,.08)',
      red: '#ff6b6b',
      green: '#6bff9a',
      white: '#e6eef9'
    };

    const State = { Drag: 'drag', Carry: 'carry', Balloons: 'balloons', Done: 'done' };

    let state, ball, goal, storage, walls, keys, balloons, popScore, needRed, poppedGreen, stageTimer;

    function init() {
      state = State.Drag;
      keys = { left:false, right:false, up:false, down:false };
      // Stage 1 positions (randomized each run)
      const margin = 80;
      ball = { r: 26, x: rand(margin, W/3), y: rand(margin, H - margin), dragging: false, offsetX:0, offsetY:0 };
      goal = { r: 34, x: rand(W*0.65, W - margin), y: rand(margin, H - margin) };

      // Stage 2: a storage room rectangle and soft maze walls
      storage = { x: px(W*0.76), y: px(H*0.12), w: px(W*0.18), h: px(H*0.22) };
      walls = makeMaze();

      // Stage 3 balloons setup
      balloons = [];
      popScore = 0; needRed = 0; poppedGreen = 0; stageTimer = 0;

      updateStatus();
    }

    function makeMaze() {
      // Lightweight random-ish walls for stage 2
      const ws = [];
      const pad = 40;
      for (let i=0;i<5;i++) {
        const w = px(rand(120, 200));
        const h = px(rand(16, 26));
        const x = px(rand(pad, W - pad - w));
        const y = px(rand(pad, H - pad - h));
        // keep away from storage zone a bit
        if (x > storage?.x - 80 && x < storage?.x + storage?.w + 80 && y > storage?.y - 80 && y < storage?.y + storage?.h + 80) continue;
        ws.push({x,y,w,h});
      }
      return ws;
    }

    // Geometry helpers
    const dist = (x1,y1,x2,y2) => Math.hypot(x2-x1,y2-y1);
    const circleHitRect = (cx,cy,cr, r) => {
      const nx = Math.max(r.x, Math.min(cx, r.x + r.w));
      const ny = Math.max(r.y, Math.min(cy, r.y + r.h));
      return dist(cx,cy,nx,ny) <= cr;
    };

    // Input
    let pointerId = null;
    canvas.addEventListener('pointerdown', (e)=>{
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (canvas.width / rect.width);
      const y = (e.clientY - rect.top) * (canvas.height / rect.height);
      if (dist(x,y,ball.x,ball.y) <= ball.r) {
        pointerId = e.pointerId;
        ball.dragging = true;
        ball.offsetX = x - ball.x;
        ball.offsetY = y - ball.y;
        canvas.setPointerCapture(pointerId);
      }
    });
    canvas.addEventListener('pointermove', (e)=>{
      if (!ball.dragging) return;
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (canvas.width / rect.width);
      const y = (e.clientY - rect.top) * (canvas.height / rect.height);
      ball.x = px(Math.max(ball.r, Math.min(W - ball.r, x - ball.offsetX)));
      ball.y = px(Math.max(ball.r, Math.min(H - ball.r, y - ball.offsetY)));
    });
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    function endDrag(e){
      if (pointerId !== null) canvas.releasePointerCapture(pointerId);
      ball.dragging = false; pointerId = null;
    }

    window.addEventListener('keydown', (e)=>{
      const k = e.key.toLowerCase();
      if (['arrowleft','a'].includes(k)) keys.left = true;
      if (['arrowright','d'].includes(k)) keys.right = true;
      if (['arrowup','w'].includes(k)) keys.up = true;
      if (['arrowdown','s'].includes(k)) keys.down = true;
    });
    window.addEventListener('keyup', (e)=>{
      const k = e.key.toLowerCase();
      if (['arrowleft','a'].includes(k)) keys.left = false;
      if (['arrowright','d'].includes(k)) keys.right = false;
      if (['arrowup','w'].includes(k)) keys.up = false;
      if (['arrowdown','s'].includes(k)) keys.down = false;
    });

    resetBtn.addEventListener('click', ()=>init());

    // Stage transitions
    function updateStatus(msg) {
      const text = msg || (
        state === State.Drag ? 'Stage 1: Drag the circle into the glowing target.' :
        state === State.Carry ? 'Stage 2: Use arrow keys to carry the ball+goal into the storage room.' :
        state === State.Balloons ? 'Stage 3: Pop all RED balloons. Do NOT pop any GREEN ones.' :
        '✅ Completed. You are human.'
      );
      statusEl.textContent = text;
    }

    function toCarry() { state = State.Carry; updateStatus(); }
    function toBalloons() {
      state = State.Balloons; updateStatus();
      balloons = [];
      popScore = 0; needRed = 0; poppedGreen = 0; stageTimer = 0;
      // Create a wave of balloons (8–12 total, 60% red)
      const total = Math.floor(rand(8, 12));
      for (let i=0;i<total;i++) {
        const isRed = Math.random() < 0.6;
        if (isRed) needRed++;
        balloons.push({
          color: isRed ? 'red' : 'green',
          x: rand(60, W-60),
          y: rand(H*0.65, H-30),
          r: rand(16, 26),
          vy: rand(-0.9, -0.4),
          popped: false,
        });
      }
      // Clicks to pop
      canvas.addEventListener('click', onClickBalloons);
    }

    function onClickBalloons(e){
      if (state !== State.Balloons) return;
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (canvas.width / rect.width);
      const y = (e.clientY - rect.top) * (canvas.height / rect.height);
      for (let i=balloons.length-1;i>=0;i--) {
        const b = balloons[i];
        if (!b.popped && dist(x,y,b.x,b.y) <= b.r) {
          b.popped = true;
          if (b.color === 'red') popScore++;
          else poppedGreen++;
          break;
        }
      }
    }

    function finish() {
      state = State.Done;
      updateStatus('✅ Completed. You are human.');
      canvas.removeEventListener('click', onClickBalloons);
    }

    // Physics / updates per frame
    function step(dt) {
      if (state === State.Drag) {
        // If circles overlap, lock together and advance
        if (dist(ball.x, ball.y, goal.x, goal.y) <= (ball.r + goal.r - 6)) {
          // Snap ball to goal center to make the transition obvious
          ball.x = goal.x; ball.y = goal.y;
          toCarry();
        }
      }
      else if (state === State.Carry) {
        // Movement
        const sp = 2.4;
        const vx = (keys.right - keys.left) * sp;
        const vy = (keys.down - keys.up) * sp;
        ball.x = Math.max(ball.r, Math.min(W - ball.r, ball.x + vx));
        ball.y = Math.max(ball.r, Math.min(H - ball.r, ball.y + vy));
        // goal follows (carried together)
        goal.x = ball.x; goal.y = ball.y;

        // Collide with walls (simple separation)
        walls.forEach(w => {
          if (circleHitRect(ball.x, ball.y, ball.r, w)) {
            // push out in the smallest axis
            const cx = Math.max(w.x, Math.min(ball.x, w.x + w.w));
            const cy = Math.max(w.y, Math.min(ball.y, w.y + w.h));
            const dx = ball.x - cx;
            const dy = ball.y - cy;
            if (Math.abs(dx) > Math.abs(dy)) ball.y += (dy < 0 ? -1 : 1) * 2.4; else ball.x += (dx < 0 ? -1 : 1) * 2.4;
          }
        });

        // Win condition: goal (with ball) inside storage
        const inside =
          ball.x - ball.r > storage.x + 6 &&
          ball.x + ball.r < storage.x + storage.w - 6 &&
          ball.y - ball.r > storage.y + 6 &&
          ball.y + ball.r < storage.y + storage.h - 6;
        if (inside) toBalloons();
      }
      else if (state === State.Balloons) {
        stageTimer += dt;
        balloons.forEach(b => {
          if (!b.popped) {
            b.y += b.vy;
            if (b.y < -40) { // respawn from bottom to keep things lively
              b.y = H + 20; b.x = rand(40, W-40);
            }
          }
        });
        // Fail if any green popped, quick reset of Stage 3 only
        if (poppedGreen > 0) {
          updateStatus('❌ You popped a GREEN balloon. Try again: pop only RED.');
          toBalloons();
          return;
        }
        // Pass if all reds popped within reasonable human time (> 0.8s to avoid instant bots)
        if (popScore >= needRed && stageTimer > 0.8) finish();
      }
    }

    // Rendering
    function draw() {
      // background
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0, COLORS.field[0]);
      g.addColorStop(1, COLORS.field[1]);
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

      // subtle grid
      ctx.strokeStyle = 'rgba(255,255,255,.03)'; ctx.lineWidth = 1;
      for (let x=0;x<W;x+=30){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
      for (let y=0;y<H;y+=30){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

      // Stage-specific decorations
      if (state === State.Carry || state === State.Balloons || state === State.Done) {
        // storage room
        ctx.fillStyle = 'rgba(100,211,255,.08)';
        ctx.strokeStyle = COLORS.storage; ctx.lineWidth = 3;
        roundRect(ctx, storage.x, storage.y, storage.w, storage.h, 12, true, true);
        drawLabel(storage.x + storage.w/2, storage.y - 10, 'Storage Room');
      }

      if (state === State.Carry) {
        // walls
        walls.forEach(w => {
          ctx.fillStyle = COLORS.wall;
          ctx.fillRect(w.x, w.y, w.w, w.h);
          ctx.strokeStyle = COLORS.wallEdge; ctx.strokeRect(w.x+0.5,w.y+0.5,w.w-1,w.h-1);
        });
      }

      if (state === State.Balloons || state === State.Done) {
        // balloons
        balloons.forEach(b => {
          if (b.popped) return;
          ctx.save();
          ctx.translate(b.x, b.y);
          ctx.fillStyle = b.color === 'red' ? COLORS.red : COLORS.green;
          ctx.beginPath(); ctx.arc(0,0,b.r,0,Math.PI*2); ctx.fill();
          // string
          ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.moveTo(0,b.r); ctx.quadraticCurveTo(6,b.r+10,0,b.r+24); ctx.stroke();
          ctx.restore();
        });
        // HUD numbers
        ctx.fillStyle = COLORS.white; ctx.font = '16px ui-monospace, SFMono-Regular, Menlo, monospace';
        ctx.fillText(`Red popped: ${popScore}/${needRed}`, 14, 24);
      }

      // goal (glow)
      if (state === State.Drag || state === State.Carry) {
        ctx.save();
        const glow = ctx.createRadialGradient(goal.x, goal.y, 4, goal.x, goal.y, goal.r*2.2);
        glow.addColorStop(0, 'rgba(92,245,162,.45)');
        glow.addColorStop(1, 'rgba(92,245,162,0)');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(goal.x, goal.y, goal.r*2.2, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = COLORS.goal; ctx.beginPath(); ctx.arc(goal.x, goal.y, goal.r, 0, Math.PI*2); ctx.fill();
        drawLabel(goal.x, goal.y - goal.r - 10, state===State.Drag? 'Goal' : 'Carry to Storage');
        ctx.restore();
      }

      // ball
      if (state !== State.Balloons || state === State.Done) {
        ctx.fillStyle = COLORS.ball; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 2; ctx.stroke();
      }

      if (state === State.Done) {
        ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0,0,W,H);
        ctx.fillStyle = COLORS.white; ctx.font = '28px system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.fillText('✅ Verified. Thanks!', W/2, H/2);
      }
    }

    function drawLabel(x,y,text){
      ctx.save();
      ctx.font = '14px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(0,0,0,.4)';
      ctx.fillRect(x - ctx.measureText(text).width/2 - 8, y - 11, ctx.measureText(text).width + 16, 20);
      ctx.fillStyle = '#d8fbe8'; ctx.fillText(text, x, y);
      ctx.restore();
    }

    function roundRect(ctx, x, y, w, h, r, fill, stroke) {
      if (typeof r === 'number') r = {tl:r,tr:r,br:r,bl:r};
      ctx.beginPath();
      ctx.moveTo(x + r.tl, y);
      ctx.lineTo(x + w - r.tr, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r.tr);
      ctx.lineTo(x + w, y + h - r.br);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
      ctx.lineTo(x + r.bl, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r.bl);
      ctx.lineTo(x, y + r.tl);
      ctx.quadraticCurveTo(x, y, x + r.tl, y);
      if (fill) ctx.fill(); if (stroke) ctx.stroke();
    }

    // Main loop
    let last = performance.now();
    function loop(t) {
      const dt = (t - last) / 1000; last = t;
      step(dt);
      draw();
      requestAnimationFrame(loop);
    }

    // Kick off
    init();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
