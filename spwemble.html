<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spwemble — Spelling Mistake Mwaker</title>
  <style>
    body {
      font-family: "Comic Sans MS", sans-serif;
      background: #fff8fc;
      color: #444;
      text-align: center;
      padding: 2em;
    }
    textarea {
      width: 90%;
      height: 150px;
      font-size: 1em;
      padding: 1em;
      margin-bottom: 1em;
      border: 2px dashed #ff69b4;
      border-radius: 10px;
      background: #fff0f5;
    }
    button {
      font-size: 1.2em;
      padding: 0.5em 2em;
      background: #ffc0cb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #ff90b3;
    }
  </style>
</head>
<body>
  <h1>✨ Spwemble ✨</h1>
  <p>Twype youw text bewow and spwemblify it!</p>
  <textarea id="input" placeholder="Type yuw text hewe~"></textarea><br>
  <button onclick="spwemble()">Spwemble!</button>
  <h2>🌀 Output:</h2>
  <textarea id="output" readonly></textarea>

  <script>
    function spwemble() {
      const text = document.getElementById("input").value;
      let t = text;
      const rules = [
        [/th/gi, "tw"],
        [/r/gi, "w"],
        [/l/gi, "w"],
        [/s/gi, "sh"],
        [/n/gi, "ny"],
        [/ove/gi, "uv"]
      ];
      for (const [pattern, replacement] of rules) {
        t = t.replace(pattern, replacement);
      }
      document.getElementById("output").value = t;
    }
  </script>
</body>
</html>
