<!DOCTYPE html>
<html>
  <style>
    .boxed-paragraph {
  border: 2px solid #333; /* Adds a 2px solid border in a dark gray color */
  padding: 10px; /* Creates internal spacing between the text and the border */
  margin: 10px; /* Creates external spacing around the box */
  background-color: #f0f0f0; /* Sets a light gray background color */
  border-radius: 8px; /* Rounds the corners of the box */
  box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.2); /* Adds a subtle shadow */
}
  </style>
  
  <body>
    <h1 style="font-family: sans-serif;">Homepage</h1>
    <div class="boxed-paragraph">
    <p style="color: green; font-family: sans-serif; ">Notification: Thank you for signing in!</p>
    </div>
    
    <h2 style="font-family: sans-serif; ">Welcome, Xiaodi!</h2>
    <img src="cat.gif">
    
    <br><br>
    
    <a href="index.html" style="color: black; font-family: sans-serif; text-decoration: none;">> Sign out</a>
  </body>
</html>
